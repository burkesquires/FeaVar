name: Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # This installs your package (FeaVar) plus the 'dev' dependencies from pyproject.toml
        pip install ".[dev]"

    - name: Run Tests
      # This runs pytest. If you don't have tests yet, this step will fail or do nothing.
      run: |
        pytest
