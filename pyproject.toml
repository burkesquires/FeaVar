[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FeaVar"
version = "1.0.1"
description = "A python package to compute clusters of sequence feature variant types (SFVTs)."
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "R. Burke Squires", email = "burkesquires@gmail.com"}
]
keywords = ["bioinformatics", "sequence-alignment", "clustering", "variants", "genetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.1.1",
    "biopython>=1.80",
    "click>=8.1.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["."]  # Assumes FeaVar directory is in the root
include = ["FeaVar*"]  # Includes the FeaVar package directory

# Configuring the CLI command 'feavar'
# Note: For this to work, we may need to slightly refactor FeaVar.py 
# to wrap the argparse logic in a callable function.
[project.scripts]
feavar = "FeaVar.FeaVar:run_cli"